name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veto
          POSTGRES_PASSWORD: veto
          POSTGRES_DB: veto
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U veto -d veto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://veto:veto@localhost:5440/veto

    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale del campo "packageManager" de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Migraciones
        run: pnpm db:migrate

      - name: Reglas de la base de datos
        run: pnpm db:test

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build
