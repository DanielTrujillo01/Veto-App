# Solo la base de datos. La API y la web se corren en tu máquina (pnpm dev)
# para tener recarga en caliente.
services:
  db:
    image: postgres:17
    container_name: veto-db
    environment:
      POSTGRES_USER: veto
      POSTGRES_PASSWORD: veto
      POSTGRES_DB: veto
    ports:
      - '5440:5432'
    volumes:
      - veto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veto -d veto']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  veto_pgdata:
