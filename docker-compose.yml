# Entorno de demostración local. No carga .env; la base queda aislada en el volumen veto_pgdata.
services:
  db:
    image: postgres:17
    container_name: veto-db
    environment:
      POSTGRES_USER: veto
      POSTGRES_PASSWORD: veto
      POSTGRES_DB: veto
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - veto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veto -d veto']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://veto:veto@db:5432/veto
    command: ['node', 'db/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://veto:veto@db:5432/veto
    command: ['node', 'db/seed-local.mjs']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://veto:veto@db:5432/veto
      API_PORT: '3001'
      WEB_ORIGIN: http://localhost:3000
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: Veto Local <no-reply@veto.local>
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  figma:
    profiles: ['prototype']
    build:
      context: .
      dockerfile: Dockerfile
      target: figma
    environment:
      FIGMA_DEV_SERVER_HOST: 0.0.0.0
      PORT: '8443'
    ports:
      - '127.0.0.1:8443:8443'
    restart: unless-stopped

volumes:
  veto_pgdata:
